<script>
// Если программа не запустилась — показать причину вместо пустого экрана. Срабатывает только пока идёт запуск.
window.__booted = false;
window.__bootFail = function (msg) {
  if (window.__booted) return;
  var a = document.getElementById("app");
  if (a) a.innerHTML = '<div class="boot" style="padding:40px 20px;line-height:1.5">Не удалось открыть Tropos.<br><small style="color:#999">' + String(msg || "").replace(/[<>&]/g, "") + '</small><br><br><button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:1px solid #ccc;background:#fff;font:inherit">Обновить</button></div>';
};
window.addEventListener("error", function (e) { if (e.target && e.target.tagName === "SCRIPT") window.__bootFail("не загрузилась часть программы, проверьте интернет"); }, true);
window.__bootTimer = setTimeout(function () { window.__bootFail("Очень медленный интернет — нажмите «Обновить»"); }, 30000);
if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
